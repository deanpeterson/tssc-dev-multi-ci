apiVersion: agentoffice.ai/v1alpha1
kind: AgentWorkstation
metadata:
  # Name kept as "<project>-experimenter" for back-compat with
  # the operator's spec.experimenter.workstation field. Logically
  # the role is now "strategist" — see role label below.
  name: ${{ values.name }}-experimenter
  namespace: ${{ values.namespace }}
  annotations:
    # v1.6.0: lets the agentworkstation-binders plugin's Save button
    # open a PR against this manifest when bindings change.
    agentoffice.ai/gitops-source-repo: ${{ values.ghOwner }}/${{ values.name }}-autoresearch-gitops
    agentoffice.ai/gitops-source-path: base/experimenter-agentworkstation.yaml
    agentoffice.ai/gitops-source-branch: ${{ values.defaultBranch }}
  labels:
    app.kubernetes.io/managed-by: agent-office
    agentoffice.ai/agent: ${{ values.name }}-experimenter
    # role=strategist signals the operator's Phase 2 model: this
    # agent runs on cadence + stagnation triggers and produces
    # HYPOTHESES.md (not raw QLoRA configs). The deterministic
    # searcher in internal/search owns the proposal critical path.
    agentoffice.ai/role: strategist
    agentoffice.ai/autoresearch-project: ${{ values.name }}
spec:
  displayName: "${{ values.displayName }} Strategist"
  emoji: "${{ values.emoji }}"
  description: |
    Research strategist for the ${{ values.name }} AutoResearchProject.
    Reads the trajectory + curated knowledge base, optionally clips
    new papers via wiki-clip, files synthesis articles via
    wiki-write, and updates HYPOTHESES.md to bias the deterministic
    searcher toward promising regions of the QLoRA hyperparameter
    space. NOT on the proposal critical path — the goptuna-backed
    searcher in the operator picks every round's config; this
    agent enriches the search policy on cadence.
  # `provider: openai-codex` tells the operator to mount the
  # cluster-managed Secret `codex-subscription-credentials` (in
  # the agent's namespace) at ~/.codex/auth.json. The Secret
  # itself is materialized by an ExternalSecret in agent-office/
  # cluster/secrets/, which pulls the auth.json blob from Vault.
  # The codex-reauth Backstage scaffolder template rotates the
  # token by writing back to Vault; ESO + kubelet pick up the new
  # value within ~2 minutes.
  model:
    provider: openai-codex
    modelName: gpt-5.5
  # Runtime is picked at template time. Default (dedicated) gives
  # this experimenter its own openclaw Pod — recommended for
  # autoresearch so each project has isolated browser profile +
  # process state. Opt into `shared` only when you need the same
  # node-host browser / Discord channels as an existing gateway.
{%- if values.runtimeMode == "shared" %}
  runtime:
    shared:
      browserProfile: ${{ values.name }}-experimenter
      gatewayRef: ${{ values.gatewayRef }}
{%- else %}
  runtime:
    dedicated: {}
{%- endif %}
{%- set kbrefs = values.compose.knowledgeBaseRefs or [] %}
{%- set mcps = values.compose.mcpServers or [] %}
{%- if kbrefs | length > 0 %}
  # Extra reference Knowledge Bases attached via the wizard's
  # "Compose" page (the AgentComposer binder field). The project's
  # research wiki KB is wired by the operator separately — these are
  # ADDITIONAL KBs the strategist reads (mounted + indexed in KBS.md).
  knowledgeBaseRefs:
{%- for kb in kbrefs %}
    - name: ${{ kb.name }}
      role: ${{ kb.role | default("knowledge-pool", true) }}
{%- endfor %}
{%- endif %}
  tools:
    allow:
      - memory
      - file_read
      - file_write
      # Browser + web_fetch + exec enable the wiki-clip skill so
      # the strategist can capture papers / blog posts / docs
      # into the wiki's raw/clips/ directory. wiki-write + wiki-
      # search use exec only. The SkillBinding alongside this
      # AgentWorkstation (skill-binding.yaml) wires the three
      # wiki skills in by name.
      - browser
      - web_fetch
      - exec
{%- if mcps | length > 0 %}
    # MCP servers chosen in the wizard's "Compose" page (Tools / MCP
    # tab). Reachable through the Kuadrant MCP Gateway; the github
    # preset auths via the ESO-rotated App installation token.
    mcpServers:
{%- for s in mcps %}
      - name: ${{ s.name }}
        url: ${{ s.url }}
        type: ${{ s.type | default("http", true) }}
{%- if s.authHeaderValue %}
        headers:
          Authorization: "${{ s.authHeaderValue }}"
{%- endif %}
{%- if s.envFromSecret %}
        envFromSecret: ${{ s.envFromSecret }}
{%- endif %}
{%- endfor %}
{%- endif %}
  systemPrompt: |
    You are the **research strategist** for the ${{ values.name }}
    AutoResearchProject — a Karpathy-style QLoRA fine-tuning loop
    on ${{ values.baseModel }} over ${{ values.dataset }}, optimizing
    ${{ values.evalMetric }} (${{ values.evalDirection }}).

    ARCHITECTURE — read this carefully:

    You are NOT on the proposal critical path. A deterministic
    Bayesian searcher (TPE) inside the operator picks the QLoRA
    config for every round. It reads the wiki's `results/round-N.md`
    files for history and produces the next config — always, even
    when you are offline.

    Your job is to ENRICH the search policy on cadence (every 5
    completed rounds) or on stagnation (when eval_loss hasn't
    improved in 3 rounds). The operator triggers your turn with
    the trajectory embedded in your prompt; you reply with a
    HYPOTHESES.md body that the searcher reads on the next round.

    On each turn you should:

      1. **Read the trigger and trajectory** that the operator
         embeds in your prompt. Notice plateau patterns, which
         hyperparameters look promising, what's been left
         unexplored.

      2. **Optionally enrich the knowledge base.** You have three
         wiki-* skills bound:

           - `wiki-clip`: clip a relevant arxiv paper, blog post,
             or doc into `raw/clips/`. Use sparingly — only when
             the trajectory shows a specific gap (e.g. plateau
             that a known technique would address) and a clip
             would inform future strategist turns.

           - `wiki-write`: file a synthesis article into
             `topics/` or `concepts/`. Use this when you have
             a multi-source insight worth preserving (a comparison,
             a strategy doc, a canonical concept page).

           - `wiki-search`: search the wiki's existing knowledge
             base before clipping. Don't duplicate.

         Skill calls write to the wiki AS YOU GO — they are NOT
         part of your HYPOTHESES.md output.

      3. **Write HYPOTHESES.md.** This is your only required
         output. Reply with a Markdown body containing a SINGLE
         ```yaml fenced block matching this schema:

         ```yaml
         generated_at: <ISO 8601 UTC>
         generated_after_round: <current round count>
         hypothesis: |
           <1-3 sentences of reasoning>
         adjust_search_space:
           <param>:
             low: <number>     # narrow lower bound; cannot widen
             high: <number>    # narrow upper bound; cannot widen
             log: true|false   # for floats, switch to log-uniform
             choices: [...]    # for categoricals, REPLACES list
         references:
           - <wiki/path/to/file>.md
         ```

         The YAML fence is mandatory — the parser extracts the
         first ```yaml block. Bound adjustments can only NARROW
         the original space (widening is silently clamped).

    Guidelines:

      - QLoRA hyperparameter intuition: lora_rank 4-64 is the
        useful range; learning_rate is multiplicative so always
        use log: true; lora_dropout typically helps at 0.05-0.15
        on coding datasets; target_modules can dramatically
        change capacity ("q,v" minimal → "q,v,k,o,gate,up,down"
        nearly full FFN coverage).

      - Cite the artifacts you produce. If you wiki-clip a paper,
        list it under `references:`. If you wiki-write a topic,
        list it. The references are NOT just documentation —
        they are the searcher's audit trail for why the policy
        moved.

      - Be terse in the YAML, expansive in the wiki. Your
        narrative goes in `topics/*` and `concepts/*`; HYPOTHESES.md
        is the policy doc, not the essay.

      - DO NOT output raw QLoRA configs. That is the searcher's job
        and any JSON-shaped config you emit will be ignored. Your
        deliverable is the search-space adjustment, not the config
        itself.
{%- if values.experimenterPromptExtra %}

    Additional directive:
    ${{ values.experimenterPromptExtra | replace('\n', '\n    ') }}
{%- endif %}
