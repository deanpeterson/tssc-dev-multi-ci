apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  title: ${{ values.displayName }}
  description: ${{ values.description }}
  links:
    - url: "https://devspaces.apps.salamander.aimlworkbench.com/#https://github.com/${{ values.ghOwner }}/${{ values.name }}-autoresearch-gitops"
      title: "Open GitOps in Dev Spaces"
      icon: catalog
      type: devspaces
    - url: ${{ values.wikiRepoURL }}
      title: "Open Wiki on GitHub"
      icon: catalog
    - url: "https://devspaces.apps.salamander.aimlworkbench.com/#${{ values.wikiRepoURL }}"
      title: "Edit Wiki in Dev Spaces"
      icon: catalog
      type: devspaces
  annotations:
    argocd/app-name: ${{ values.name }}-autoresearch
    backstage.io/kubernetes-id: ${{ values.name }}
    agentoffice.ai/base-model: ${{ values.baseModel }}
    agentoffice.ai/dataset: ${{ values.dataset }}
    # Discriminator used by the codex-reauth-ui CodexAuthCard
    # mountPoint filter so the auth-status card only surfaces on
    # agent component pages (not every Component the cluster has).
    # Also lights up the agentworkstation-binders Bindings card.
    agentoffice.ai/agent-kind: autoresearch
    # v1.6.0: tells the agentworkstation-binders plugin which AW this
    # project entity manages bindings for. The project entity is named
    # <name>; the actual agent is the experimenter AW (<name>-experimenter,
    # matching AutoResearchProject.spec.experimenter.workstation).
    agentoffice.ai/agentworkstation-name: ${{ values.name }}-experimenter
    agentoffice.ai/namespace: ${{ values.namespace }}
  tags:
    - ai
    - autoresearch
    - qlora
    - openshift
spec:
  type: ai-loop
  owner: ${{ values.owner }}
  lifecycle: experimental
