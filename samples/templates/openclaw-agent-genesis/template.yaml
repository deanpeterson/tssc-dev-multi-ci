# openclaw-agent-genesis — the ONE-STEP agent creator.
#
# The standard openclaw-agent template asks seven pages of questions.
# This one asks ONE: "What will your agent be doing?" The AgentGenesis
# field (binders plugin >= v0.0.10) sends that description to the
# operator's POST /catalog/recommend (>= v1.7.12), which selects packs
# from the live catalog — skills, governed tools, knowledge bases —
# and drafts the identity. The user reviews, picks the brain (Codex
# subscription or Claude + API key, the same auth paths the platform
# already runs), and hits Create.
#
# Everything below the fold is DEFAULTED, not asked: shared runtime on
# research-gateway, agent-office namespace, ApplicationSet-managed
# ArgoCD, catalog registration. Change those in the standard template
# if you need them — this template's contract is exactly one decision
# surface.
#
# GIT PROVIDER — a PER-HIRE verdict, decided by who is hiring, never a
# deployment-wide switch. Both providers stay live simultaneously:
#
#   auto (the default) — publish to the in-cluster Gitea ONLY when the
#     cluster offers one (giteaHost set at registration) AND the
#     signed-in user is a Keycloak-ingested attendee (keycloak.org/id
#     annotation on their catalog User entity, stamped by the keycloak
#     catalog module). Everyone else — GitHub sign-ins, users with no
#     catalog entity, any cluster with no giteaHost — keeps publishing
#     to GitHub under enterprisewebservice, byte-for-byte as before.
#   github / gitea — explicit forces, for tests and migration.
#
# The gitea side publishes to the attendee's own org,
# <username><giteaOrgSuffix>, pre-created by the deployer. A per-user
# ORG — not the bare user namespace — because both publish:gitea and
# ArgoCD's Gitea scmProvider generator only operate on orgs; the org
# is owned by the attendee, so it IS their namespace in practice.
# Discovery is a SECOND ApplicationSet (gitea scmProvider) running in
# parallel with the GitHub one — neither replaces the other.
#
# gitProvider / giteaHost / giteaOrgSuffix are hidden parameters. The
# only default a gitea cluster's installer rewrites at registration
# time is giteaHost; gitProvider ships as auto everywhere. Attendees
# still see exactly one field.
#
# The skeleton is the standard template's, unchanged — one skeleton,
# two front doors.
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: openclaw-agent-create
  title: OpenClaw Agent
  description: >-
    Describe the job; the platform composes the agent from the catalog —
    skills, governed tools, knowledge — drafts its identity, and deploys
    it on the governed runtime. One page, one Create.
  tags:
    - openclaw
    - agent
    - genesis
spec:
  owner: user:default/deanpeterson
  type: service

  parameters:
    - title: Describe your agent
      required:
        - agent
      properties:
        # Key name drives the review page's row labels: `genesis` rendered
        # every field as "Genesis Name", "Genesis Role"… `agent` reads
        # correctly ("Agent Name", "Agent Selection") with no extra config.
        agent:
          title: Agent
          type: object
          ui:field: AgentGenesis
        # ---- Platform wiring (hidden; per-cluster, not per-user) ----
        # Same page as `agent` on purpose: a new parameters entry would
        # add a wizard page and break the one-page contract. ui:widget
        # hidden renders nothing; ui:backstage.review.show false keeps
        # them off the review table.
        gitProvider:
          title: Git Provider
          type: string
          description: >-
            Where this hire's gitops repo is published. auto routes by
            the signed-in user: Keycloak-ingested attendees
            (keycloak.org/id annotation) go to the in-cluster Gitea when
            giteaHost is set, everyone else to GitHub — both providers
            serve simultaneously. github/gitea force a side (tests,
            migration).
          enum:
            - auto
            - github
            - gitea
          default: auto
          ui:widget: hidden
          ui:backstage:
            review:
              show: false
        giteaHost:
          title: Gitea Host
          type: string
          description: >-
            Host (no scheme) of the in-cluster Gitea, e.g.
            gitea.apps.cluster-xxxx.example.com. Must match a host under
            integrations.gitea in the RHDH app-config, or publish:gitea
            cannot resolve credentials.
          default: ''
          ui:widget: hidden
          ui:backstage:
            review:
              show: false
        giteaOrgSuffix:
          title: Gitea Org Suffix
          type: string
          description: >-
            Appended to the logged-in username to name the per-user Gitea
            org repos publish into. The org must pre-exist (the deployer
            creates one per attendee) — publish:gitea refuses to create
            orgs, and an org cannot share a name with its owning user.
          default: '-agents'
          ui:widget: hidden
          ui:backstage:
            review:
              show: false

  steps:
    # 1. Scaffold the gitops repo from the STANDARD template's skeleton.
    #
    # The provider-conditional values below all lean on two spellings,
    # written inline because scaffolder templates have no locals:
    #   username  — (user.entity.metadata.name if user.entity.metadata.name
    #               else user.ref | parseEntityRef | pick('name'))
    #               The entity name when the signed-in user is in the
    #               catalog; parsed from the sign-in ref otherwise
    #               (salamander signs users in without catalog entities).
    #   gitea org — username + giteaOrgSuffix.
    #   the verdict — gitea iff forced, OR auto AND the cluster has a
    #               giteaHost AND the user entity carries keycloak.org/id:
    #               (parameters.gitProvider === 'gitea' or (parameters.gitProvider === 'auto' and parameters.giteaHost and user.entity.metadata.annotations and user.entity.metadata.annotations['keycloak.org/id']))
    # Every github branch is the pre-split literal, unchanged.
    - id: fetch-gitops
      name: Fetch GitOps Skeleton
      action: fetch:template
      input:
        url: ../openclaw-agent/skeleton
        targetPath: gitops
        values:
          name: ${{ parameters.agent.name }}
          displayName: ${{ parameters.agent.displayName }}
          emoji: ${{ parameters.agent.emoji }}
          description: ${{ parameters.agent.description }}
          role: ${{ parameters.agent.role }}
          capabilities: []
          systemPrompt: ${{ parameters.agent.systemPrompt }}
          provider: ${{ parameters.agent.provider }}
          modelName: ${{ parameters.agent.modelName }}
          routerRef: ''
          apiKey: ${{ parameters.agent.apiKey }}
          compose: ${{ parameters.agent.compose }}
          createNewKnowledgeBase: false
          newKnowledgeBaseTopic: ''
          discordChannelUrl: ''
          namespace: agent-office
          runtimeMode: shared
          # The TEAM, chosen by Suggest (operator >= v1.7.32) — not a
          # dropdown. A gateway is a shared runtime, a shared browser
          # node and one blast radius, so which one an agent joins is a
          # platform decision made from the description, exactly like
          # the packs. research-gateway stays as the floor for an older
          # operator that returns no team at all.
          gatewayRef: ${{ parameters.agent.gatewayRef if parameters.agent.gatewayRef else 'research-gateway' }}
          # True when Suggest found no existing crew doing this work
          # (operator >= v1.7.33). The skeleton then ships an
          # AgentGateway named for the TEAM alongside the agent, so the
          # next agent routed here joins it instead of founding a rival.
          createGateway: ${{ (parameters.agent.team.existing == false) if parameters.agent.team else false }}
          # Provider flag for skeleton conditionals (the Dev Spaces
          # deep-link is salamander-only and drops off on gitea).
          gitProvider: ${{ 'gitea' if (parameters.gitProvider === 'gitea' or (parameters.gitProvider === 'auto' and parameters.giteaHost and user.entity.metadata.annotations and user.entity.metadata.annotations['keycloak.org/id'])) else 'github' }}
          # Catalog owner: the attendee on gitea clusters; the platform
          # owner on the GitHub reference cluster, unchanged.
          owner: >-
            ${{ 'user:default/' + (user.entity.metadata.name if user.entity.metadata.name else user.ref | parseEntityRef | pick('name')) if (parameters.gitProvider === 'gitea' or (parameters.gitProvider === 'auto' and parameters.giteaHost and user.entity.metadata.annotations and user.entity.metadata.annotations['keycloak.org/id'])) else 'user:default/deanpeterson' }}
          # Repo owner: the attendee's Gitea org / the GitHub org. Also
          # lands in the AW's gitops-source-repo annotation as the
          # owner/repo shorthand, which stays truthful on both providers.
          ghOwner: >-
            ${{ (user.entity.metadata.name if user.entity.metadata.name else user.ref | parseEntityRef | pick('name')) + parameters.giteaOrgSuffix if (parameters.gitProvider === 'gitea' or (parameters.gitProvider === 'auto' and parameters.giteaHost and user.entity.metadata.annotations and user.entity.metadata.annotations['keycloak.org/id'])) else 'enterprisewebservice' }}
          # Web URL of the gitops repo — the skeleton's application.yaml
          # embeds it (with .git) as the ArgoCD source repoURL.
          repoURL: >-
            ${{ 'https://' + parameters.giteaHost + '/' + ((user.entity.metadata.name if user.entity.metadata.name else user.ref | parseEntityRef | pick('name')) + parameters.giteaOrgSuffix) + '/' + parameters.agent.name + '-agent-gitops' if (parameters.gitProvider === 'gitea' or (parameters.gitProvider === 'auto' and parameters.giteaHost and user.entity.metadata.annotations and user.entity.metadata.annotations['keycloak.org/id'])) else 'https://github.com/enterprisewebservice/' + parameters.agent.name + '-agent-gitops' }}
          # ArgoCD Application name. On gitea clusters the per-user org
          # prefixes it so two attendees can both hire a "morgan" without
          # their Applications colliding; MUST match what the gitea
          # ApplicationSet template computes:
          # {{ .organization }}-{{ trimSuffix "-gitops" .repository }}.
          # On GitHub it stays <name>-agent, exactly as before.
          argoAppName: >-
            ${{ (user.entity.metadata.name if user.entity.metadata.name else user.ref | parseEntityRef | pick('name')) + parameters.giteaOrgSuffix + '-' + parameters.agent.name + '-agent' if (parameters.gitProvider === 'gitea' or (parameters.gitProvider === 'auto' and parameters.giteaHost and user.entity.metadata.annotations and user.entity.metadata.annotations['keycloak.org/id'])) else parameters.agent.name + '-agent' }}
          defaultBranch: main
          argoNS: openshift-gitops
          argoProject: agent-office

    # 2a. Publish the gitops repo — GitHub (reference cluster).
    #     Byte-for-byte the pre-split step, now gated on the provider.
    - id: publish-gitops
      name: Publish GitOps Repository
      if: ${{ 'false' if (parameters.gitProvider === 'gitea' or (parameters.gitProvider === 'auto' and parameters.giteaHost and user.entity.metadata.annotations and user.entity.metadata.annotations['keycloak.org/id'])) else 'true' }}
      action: publish:github
      input:
        repoUrl: github.com?owner=enterprisewebservice&repo=${{ parameters.agent.name }}-agent-gitops
        sourcePath: gitops
        defaultBranch: main
        repoVisibility: public
        gitAuthorName: Dean Peterson
        gitAuthorEmail: deanpeterson@users.noreply.github.com
        description: 'GitOps manifests for OpenClaw agent: ${{ parameters.agent.displayName }} (one-step genesis)'

    # 2b. Publish the gitops repo — Gitea (workshop clusters).
    #     Credentials come from integrations.gitea in the RHDH
    #     app-config (username/password from a Secret; publish:gitea
    #     hard-requires both). The commit is authored as the attendee.
    - id: publish-gitops-gitea
      name: Publish GitOps Repository (Gitea)
      if: ${{ 'true' if (parameters.gitProvider === 'gitea' or (parameters.gitProvider === 'auto' and parameters.giteaHost and user.entity.metadata.annotations and user.entity.metadata.annotations['keycloak.org/id'])) else 'false' }}
      action: publish:gitea
      input:
        repoUrl: >-
          ${{ parameters.giteaHost }}?owner=${{ (user.entity.metadata.name if user.entity.metadata.name else user.ref | parseEntityRef | pick('name')) + parameters.giteaOrgSuffix }}&repo=${{ parameters.agent.name }}-agent-gitops
        sourcePath: gitops
        defaultBranch: main
        repoVisibility: public
        gitAuthorName: >-
          ${{ user.entity.spec.profile.displayName if user.entity.spec.profile.displayName else (user.entity.metadata.name if user.entity.metadata.name else user.ref | parseEntityRef | pick('name')) }}
        gitAuthorEmail: >-
          ${{ user.entity.spec.profile.email if user.entity.spec.profile.email else (user.entity.metadata.name if user.entity.metadata.name else user.ref | parseEntityRef | pick('name')) + '@users.noreply.' + parameters.giteaHost }}
        description: 'GitOps manifests for OpenClaw agent: ${{ parameters.agent.displayName }} (one-step genesis)'

    - id: wait-repo
      name: Wait for Repository
      action: debug:wait
      input:
        seconds: 3

    # ArgoCD: the agent-office-agents ApplicationSet discovers the repo
    # via its marker file — no scaffolder step, race-free, declarative.
    # GitHub: the scmProvider github generator scanning the org.
    # Gitea: per-attendee scmProvider gitea generators (one per org,
    # rendered by the deployer — Argo's gitea provider is org-only).

    # 3. Register in the catalog (binders card mounts on the entity).
    #    repoContentsUrl comes from whichever publish step ran. Gitea's
    #    ends with a trailing slash, so its catalogInfoPath drops the
    #    leading one to keep the joined URL clean.
    - id: catalog-register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: >-
          ${{ steps['publish-gitops-gitea'].output.repoContentsUrl if (parameters.gitProvider === 'gitea' or (parameters.gitProvider === 'auto' and parameters.giteaHost and user.entity.metadata.annotations and user.entity.metadata.annotations['keycloak.org/id'])) else steps['publish-gitops'].output.repoContentsUrl }}
        catalogInfoPath: >-
          ${{ 'catalog-info.yaml' if (parameters.gitProvider === 'gitea' or (parameters.gitProvider === 'auto' and parameters.giteaHost and user.entity.metadata.annotations and user.entity.metadata.annotations['keycloak.org/id'])) else '/catalog-info.yaml' }}

  output:
    links:
      - title: GitOps Repository
        url: >-
          ${{ steps['publish-gitops-gitea'].output.remoteUrl if (parameters.gitProvider === 'gitea' or (parameters.gitProvider === 'auto' and parameters.giteaHost and user.entity.metadata.annotations and user.entity.metadata.annotations['keycloak.org/id'])) else steps['publish-gitops'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['catalog-register'].output.entityRef }}
