apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  {#- Same fallback contract as the argocd/app-name annotation in
      catalog-info.yaml: <name>-agent unless the template passes an
      (org-prefixed) argoAppName, as the gitea path does. #}
  name: ${{ values.argoAppName | default(values.name + "-agent", true) }}
  namespace: ${{ values.argoNS }}
  finalizers: ["resources-finalizer.argocd.argoproj.io"]
spec:
  project: ${{ values.argoProject }}
  source:
    path: ./overlays/development
    repoURL: ${{ values.repoURL }}.git
    targetRevision: ${{ values.defaultBranch }}
  destination:
    namespace: ${{ values.namespace }}
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
