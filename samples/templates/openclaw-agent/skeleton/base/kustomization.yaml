apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace + labels applied to every resource below. The
# AgentWorkstation reconciler creates the actual runtime resources
# (Deployment, Service, Route, PVC, ConfigMap) from spec, so this
# manifest only ships the CR — the operator owns everything else.
namespace: ${{ values.namespace }}

commonLabels:
  app.kubernetes.io/name: ${{ values.name }}
  app.kubernetes.io/managed-by: agent-office
  agentoffice.ai/agent: ${{ values.name }}
  backstage.io/kubernetes-id: ${{ values.name }}

resources:
  - agentworkstation.yaml
{%- if values.runtimeMode == "dedicated" or values.createGateway %}
  # Dedicated runtime — this agent brings its OWN gateway, declared as a
  # sibling AgentGateway here (instead of joining research-gateway). The
  # operator never mints a gateway; it's a plain declarative resource in
  # this repo, so deleting the repo removes it. Shared agents omit this.
  - agentgateway.yaml
{%- endif %}
{%- if values.createNewKnowledgeBase %}
  # Optional KnowledgeBase CR — emitted only when the template form's
  # "create new KB alongside" toggle was on. The operator git-mirrors
  # its wiki PVC to <name>-wiki on GitHub.
  - knowledgebase.yaml
{%- endif %}
