apiVersion: agentoffice.ai/v1alpha1
kind: AgentWorkstation
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.namespace }}
  annotations:
    # Tells the agentworkstation-binders RHDH plugin which gitops file
    # holds this AW manifest, so the binders plugin's Save button can
    # open a PR against the right place (binders plugin v0.0.3+).
    agentoffice.ai/gitops-source-repo: ${{ values.ghOwner }}/${{ values.name }}-agent-gitops
    agentoffice.ai/gitops-source-path: base/agentworkstation.yaml
    agentoffice.ai/gitops-source-branch: ${{ values.defaultBranch }}
  labels:
    app.kubernetes.io/managed-by: agent-office
    agentoffice.ai/agent: ${{ values.name }}
{%- if values.role %}
    agentoffice.ai/role: ${{ values.role }}
{%- endif %}
spec:
  displayName: ${{ values.displayName }}
  emoji: "${{ values.emoji }}"
  description: |
    ${{ values.description | replace('\n', '\n    ') }}
{%- if values.role %}
  role: ${{ values.role }}
{%- endif %}
{%- if values.capabilities and values.capabilities | length > 0 %}
  capabilities:
{%- for cap in values.capabilities %}
    - ${{ cap }}
{%- endfor %}
{%- endif %}
  systemPrompt: |
    ${{ values.systemPrompt | replace('\n', '\n    ') }}
  # OpenClaw runtime image. Operator pulls this for the agent's
  # gateway pod when this AW joins a shared runtime.
  #
  # Tag, not digest: this used to pin sha256:8d8b5c03…, a pre-7.x build.
  # gpt-5.6-sol does not exist on that runtime, so an agent scaffolded
  # from it could never reach the model this template now defaults to.
  image: quay-quay-quay-test.apps.salamander.aimlworkbench.com/deanpeterson/openclaw:v2026.7.1
  model:
    provider: ${{ values.provider }}
{%- if values.connectionRef %}
    # Admin-published ModelConnection (cluster-scoped; operator >=
    # v1.7.58). The operator renders the matching provider block on
    # this agent's gateway and projects the key from the admin
    # namespace — this CR never holds credentials. Provider `custom`
    # is the vehicle: with a resolvable connectionRef the operator
    # keys the model string as <connection>/<modelName>.
    connectionRef: ${{ values.connectionRef }}
    modelName: ${{ values.modelName }}
{%- elif values.provider == "openai-codex" %}
    # `openai-codex` states intent: bill this agent to the ChatGPT/Codex
    # subscription. agent-office-operator >= v1.7.6 canonicalizes it to
    # `openai` when rendering the model string (OpenClaw 2026.7.x rejects
    # `openai-codex` as a legacy provider id), and the gateway's
    # spec.modelAuth pins auth.order to the OAuth profile.
    #
    # gpt-5.6-sol is subscription-only — the metered api.openai.com
    # endpoint does not serve it.
    modelName: ${{ values.modelName | default("gpt-5.6-sol", true) }}
{%- elif values.provider == "smr" %}
    modelName: ${{ values.modelName | default("auto", true) }}
{%- elif values.provider == "openai" %}
    modelName: ${{ values.modelName | default("gpt-4o-mini", true) }}
{%- elif values.provider == "anthropic" %}
    modelName: ${{ values.modelName | default("claude-sonnet-4-20250514", true) }}
{%- endif %}
{%- if values.provider == "smr" and values.routerRef %}
    modelRouterRef: ${{ values.routerRef }}
{%- endif %}

  # Runtime — every agent is a logical openclaw persona on an
  # AgentGateway. There is no "dedicated" runtime in the operator: the
  # ONLY difference is which gateway this agent's gatewayRef points at.
  runtime:
    shared:
      browserProfile: ${{ values.name }}
      # ONE reference either way: the TEAM this agent works on. Suggest
      # decides whether that team already exists — when it does this
      # joins it; when it does not, the sibling AgentGateway in this repo
      # creates it under this same name, so the next agent pointed here
      # joins instead of forking.
      #
      # Naming the gateway after the team rather than the founding agent
      # is what makes that work. A team called after whoever happened to
      # be first reads wrong the moment a second agent arrives.
      gatewayRef: ${{ values.gatewayRef }}

{%- set kbrefs = values.compose.knowledgeBaseRefs or [] %}
{%- set mcps = values.compose.mcpServers or [] %}
{%- set packs = values.packs or [] %}
{%- set skillpacks = packs | selectattr("type", "equalto", "skill") | list %}
{%- if skillpacks | length > 0 %}
  # Skills — this agent's OWN list (operator >= v1.7.68). Exactly these are
  # seeded into its workspace: platform skills resolve from the baked
  # catalog, registry skills from the Skill resources this repo declares in
  # skills/. Nothing else in the namespace reaches this agent, and a name
  # that resolves nowhere is reported in the workstation's status rather
  # than silently skipped. Remove a row here and the agent forgets it.
  skillRefs:
{%- for sk in skillpacks %}
    - name: ${{ sk.name }}
{%- if not sk.installed and sk.version %}
      version: "${{ sk.version }}"
{%- endif %}
{%- endfor %}
{%- endif %}
{%- if kbrefs | length > 0 or values.createNewKnowledgeBase %}
  # KnowledgeBases — bound (explicit per agent), chosen in the wizard's
  # "Compose" page (the AgentComposer binder field). The operator mounts
  # each at /home/node/.openclaw/wiki/<name>/ inside the gateway pod and
  # renders a per-agent KBS.md index listing them. Skills are bound the
  # same way: spec.skillRefs above is this agent's own list.
  knowledgeBaseRefs:
{%- for kb in kbrefs %}
    - name: ${{ kb.name }}
      role: ${{ kb.role | default("knowledge-pool", true) }}
{%- endfor %}
{%- if values.createNewKnowledgeBase %}
    - name: ${{ values.name }}-wiki
      role: experiment-history
{%- endif %}
{%- endif %}

  # MCP servers. The governed gateway is ALWAYS wired, then anything the
  # wizard's Compose page added.
  #
  # Always, because gateway MCP config is shared by every agent in a
  # gateway pod — so an agent that declares nothing inherits whatever a
  # neighbour happened to declare. ops-reporter only ever worked because
  # forge-dev sat beside it on research-gateway and wired the gateway. The
  # moment Suggest founded a team of its own, Morgan's agent came up alone
  # with no tools and answered "I couldn't run the report" — correct, and
  # useless.
  #
  # Connecting is not a privilege: the Kuadrant gateway IS the governance
  # point, and what an agent may call is policy enforced there. The broker
  # holds the credentials (the GitHub App token is rotated every 30m via
  # ESO from Vault), so the agent never sees one.
  tools:
    # Built-in tool allow-list. Without an explicit list the runtime's default
    # profile applies and web_search is NOT among it — an agent created by this
    # template could web_fetch a URL it already knew but could not DISCOVER
    # anything (found 2026-08-16: the upstreambeat newsroom's reporter swept
    # only the GitHub release pages it had been told about). web_search is
    # bundled (duckduckgo, no key). browser = the real Chromium on the paired VM
    # node-host (see agentgateway.yaml nodeHostRef).
    allow: [memory, web_search, web_fetch, browser]
    mcpServers:
      - name: governed
        url: http://mcp-gateway-data-science-gateway-class.agent-office.svc.cluster.local/mcp
        type: http
{%- if values.gitProvider == "gitea" %}
        # Gitea-published hire (workshop seat): the seat's OWN credential,
        # not the platform's — the GitHub App token is not this tenant's to
        # carry. The bearer is pass-through material consumed by the governed
        # gitea-mcp backend on the call path (gitea_* tools act AS this
        # seat's Gitea user; a call without it fails closed — verified live
        # 2026-08-25). The Secret is <user>-gitea-token in the seat's
        # workspace (key GITEA_TOKEN), minted by the deployer's gitea stage
        # and replicated beside quay-pull-secret; <user> is the seat that
        # owns this namespace, so it is derived from values.namespace.
        headers:
          Authorization: "Bearer ${GITEA_TOKEN}"
        envFromSecret: ${{ values.namespace | replace('-agent-workspace', '') }}-gitea-token
{%- else %}
        headers:
          Authorization: "Bearer ${GITHUB_PERSONAL_ACCESS_TOKEN}"
        envFromSecret: github-mcp-installation-token
{%- endif %}
{#- The gitea entry is owned by the provider-conditional block above;
    a composed gitea recipe would duplicate it with a seat-agnostic
    placeholder secret the scaffolder rightly never substitutes. -#}
{%- for s in mcps %}
{%- if s.name != "gitea" %}
      - name: ${{ s.name }}
        url: ${{ s.url }}
        type: ${{ s.type | default("http", true) }}
{%- if s.authHeaderValue %}
        headers:
          Authorization: "${{ s.authHeaderValue }}"
{%- endif %}
{%- if s.envFromSecret %}
        envFromSecret: ${{ s.envFromSecret }}
{%- endif %}
{%- endif %}
{%- endfor %}

{%- if values.discordChannelUrl %}
  channels:
    discord:
      url: "${{ values.discordChannelUrl }}"
{%- endif %}
