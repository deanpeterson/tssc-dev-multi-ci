apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: openclaw-agent
  title: OpenClaw Agent (standard)
  description: >-
    Deploy a standard OpenClaw AI agent on OpenShift via GitOps. For
    PM agents, role-specific agents, KB-curating agents, Discord-bound
    agents — anything that ISN'T autoresearch fine-tuning (which has its
    own template). Sample system prompts for common roles (pm, etc.)
    live alongside this template in samples/.
  tags:
    - ai
    - agent
    - openclaw
    - openshift
spec:
  owner: user:default/deanpeterson
  type: service

  parameters:
    # ================================================================
    # PAGE 1 — Identity. Name + display + emoji + description +
    # owner. Same as before; nothing role-specific yet.
    # ================================================================
    - title: Agent Identity
      required:
        - name
        - displayName
        - owner
      properties:
        name:
          title: Agent Name
          type: string
          description: Unique agent name (lowercase, DNS-safe). Becomes the AgentWorkstation CR name and the Backstage Component name.
          pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$"
          maxLength: 63
          ui:autofocus: true
        displayName:
          title: Display Name
          type: string
          description: Human-readable name shown in Dev Hub + Discord
        emoji:
          title: Emoji
          type: string
          description: Single emoji for the agent avatar
          default: "\U0001F916"
          maxLength: 2
        description:
          title: Description
          type: string
          description: Brief description of what this agent does
          ui:widget: textarea
          ui:options:
            rows: 2
        owner:
          title: Owner
          type: string
          description: Owner entity reference
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind:
                - Group
                - User

    # ================================================================
    # PAGE 2 — Role & Personality. The "what kind of agent" axis.
    # role + capabilities are explicit (used by the PM Agent to match
    # tasks against agent inventory). systemPrompt is where the
    # agent's personality + protocol live.
    # ================================================================
    - title: Role & Personality
      required:
        - role
        - systemPrompt
      properties:
        role:
          title: Role
          type: string
          description: >-
            Short role label other agents match against (e.g. "pm",
            "developer", "researcher", "ops", "reviewer"). The PM
            Agent's planner uses this to assign cards to the right
            agent.
          default: assistant
        capabilities:
          title: Capabilities
          type: array
          description: >-
            Capability tags the PM Agent uses to assign cards. E.g.
            for a PM agent: project-intake, task-decomposition,
            agent-inventory.
          items:
            type: string
          default: []
        systemPrompt:
          title: Directive (System Prompt)
          type: string
          description: >-
            The agent's core directive — what it should do and how
            it should behave. For PM agents, copy the canonical
            prompt from samples/pm-agent-system-prompt.md alongside
            this template (or any saved preset). For other roles,
            write your own.
          ui:widget: textarea
          ui:options:
            rows: 14

    # ================================================================
    # PAGE 3 — LLM Backend. Same as before.
    # ================================================================
    - title: LLM Backend
      required:
        - provider
      properties:
        provider:
          title: Model Provider
          type: string
          description: Which LLM backend the agent uses
          enum:
            - openai-codex
            - smr
            - openai
            - anthropic
          enumNames:
            - OpenAI Codex Subscription (ChatGPT/Codex plan)
            - Small Model Router (on-cluster, cost-optimized)
            - OpenAI API (pay per request)
            - Anthropic API (pay per request)
          default: openai-codex
        modelName:
          title: Model Name
          type: string
          description: 'Model ID (leave empty for default). Codex default: gpt-5.4'
        routerRef:
          title: Router Name
          type: string
          description: SmallModelRouter CR name (only for SMR provider)
          ui:widget: hidden
        apiKey:
          title: API Key
          type: string
          description: API key for the selected provider (not needed for OpenAI Codex subscription)
          ui:widget: password

    # ================================================================
    # PAGE 4 — Knowledge Bases. NEW v1.6.0. Knowledge bases are bound
    # (explicit per agent) — the operator mounts each attached KB into
    # the agent's gateway pod. Skills, by contrast, are discovered
    # from the cluster catalog at runtime (every agent sees the full
    # catalog, no per-agent skill selection here).
    # ================================================================
    - title: Knowledge Bases (optional)
      properties:
        attachKnowledgeBases:
          title: Attach existing KnowledgeBases
          type: array
          description: >-
            KnowledgeBases this agent should mount + read at runtime.
            Pick from KnowledgeBase entities in the cluster catalog.
            Common pick for a PM agent — agent-platform-capabilities
            (the canonical planning-reference wiki).
          items:
            type: string
          uniqueItems: true
        createNewKnowledgeBase:
          title: Also create a NEW knowledge base for this agent to curate
          type: boolean
          description: >-
            Check if this is a "KB-creator" style agent (an agent
            whose job is to watch a topic and accumulate findings
            into a new wiki). The scaffolder will emit a fresh
            KnowledgeBase CR + git-mirrored wiki repo alongside the
            agent.
          default: false
        newKnowledgeBaseTopic:
          title: New KB — Topic / Description
          type: string
          description: 'Only used when "create new KB" is checked. What is this KB about?'

    # ================================================================
    # PAGE 5 — Channels & Tools. NEW v1.6.0.
    # ================================================================
    - title: Channels & Tools (optional)
      properties:
        discordChannelUrl:
          title: Discord Channel URL
          type: string
          description: >-
            Optional. If set, the operator binds inbound messages on
            this Discord channel to this agent. Example
            https://discord.com/channels/<guild>/<channel>.
        federateGithubMcp:
          title: Federate the GitHub MCP server (79 GitHub Issues / Projects v2 tools)
          type: boolean
          description: >-
            Check for PM-style and developer agents that need to
            create/manage GitHub Issues and Projects v2 boards. The
            tool calls go through the Kuadrant MCP Gateway; the
            broker holds the GitHub App-installation-token so the
            agent never sees credentials.
          default: false

    # ================================================================
    # PAGE 6 — Deployment. Namespace + gateway + github repo owner.
    # ================================================================
    - title: Deployment
      required:
        - namespace
        - gatewayRef
        - ghOwner
      properties:
        namespace:
          title: Namespace
          type: string
          description: OpenShift namespace the AgentWorkstation lives in
          default: agent-office
        gatewayRef:
          title: AgentGateway
          type: string
          description: >-
            Shared runtime gateway this agent runs on. Use
            research-gateway unless you have a dedicated gateway for
            your tenant.
          default: research-gateway
        ghOwner:
          title: GitHub Owner
          type: string
          description: GitHub organization or user where the gitops repo will live
          default: enterprisewebservice

  steps:
    # 1. Scaffold the gitops repo from skeleton.
    - id: fetch-gitops
      name: Fetch GitOps Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: gitops
        values:
          name: ${{ parameters.name }}
          displayName: ${{ parameters.displayName }}
          emoji: ${{ parameters.emoji }}
          description: ${{ parameters.description }}
          role: ${{ parameters.role }}
          capabilities: ${{ parameters.capabilities }}
          systemPrompt: ${{ parameters.systemPrompt }}
          provider: ${{ parameters.provider }}
          modelName: ${{ parameters.modelName }}
          routerRef: ${{ parameters.routerRef }}
          apiKey: ${{ parameters.apiKey }}
          attachKnowledgeBases: ${{ parameters.attachKnowledgeBases }}
          createNewKnowledgeBase: ${{ parameters.createNewKnowledgeBase }}
          newKnowledgeBaseTopic: ${{ parameters.newKnowledgeBaseTopic }}
          discordChannelUrl: ${{ parameters.discordChannelUrl }}
          federateGithubMcp: ${{ parameters.federateGithubMcp }}
          namespace: ${{ parameters.namespace }}
          gatewayRef: ${{ parameters.gatewayRef }}
          owner: ${{ parameters.owner }}
          ghOwner: ${{ parameters.ghOwner }}
          repoURL: https://github.com/${{ parameters.ghOwner }}/${{ parameters.name }}-agent-gitops
          defaultBranch: main
          argoNS: openshift-gitops
          argoProject: default

    # 2. Publish the gitops repo to GitHub.
    - id: publish-gitops
      name: Publish GitOps Repository
      action: publish:github
      input:
        repoUrl: github.com?owner=${{ parameters.ghOwner }}&repo=${{ parameters.name }}-agent-gitops
        sourcePath: gitops
        defaultBranch: main
        repoVisibility: public
        gitAuthorName: Dean Peterson
        gitAuthorEmail: deanpeterson@users.noreply.github.com
        description: 'GitOps manifests for OpenClaw agent: ${{ parameters.displayName }}'

    # 3. Optional: publish a NEW wiki repo if the user opted in to
    # "create new KB alongside this agent". The KB's git-mirror sync
    # uses this repo as remote.
    - id: publish-wiki
      name: Publish Wiki Repository (only when creating a new KB)
      if: ${{ parameters.createNewKnowledgeBase }}
      action: publish:github
      input:
        repoUrl: github.com?owner=${{ parameters.ghOwner }}&repo=${{ parameters.name }}-wiki
        sourcePath: gitops/wiki-seed
        defaultBranch: main
        repoVisibility: private
        gitAuthorName: Dean Peterson
        gitAuthorEmail: deanpeterson@users.noreply.github.com
        description: 'Knowledge base — curated by agent ${{ parameters.name }}.'

    # 4. Wait for repo to be available.
    - id: wait-repo
      name: Wait for Repository
      action: debug:wait
      input:
        seconds: 3

    # 5. Register ArgoCD Application.
    - id: argocd-register
      name: Register in ArgoCD
      action: argocd:create-resources
      input:
        appName: ${{ parameters.name }}-agent
        argoInstance: default
        namespace: ${{ parameters.namespace }}
        repoUrl: ${{ steps['publish-gitops'].output.remoteUrl }}
        path: overlays/development

    # 6. Register in Backstage catalog so the agent appears as a
    # Component entity (with the binders plugin's AgentBindingsCard
    # mounted on its overview page).
    - id: catalog-register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-gitops'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: GitOps Repository
        url: ${{ steps['publish-gitops'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['catalog-register'].output.entityRef }}
