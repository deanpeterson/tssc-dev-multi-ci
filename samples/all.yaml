apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: agent-office-templates
  description: Agent Office software templates (OpenClaw + research agents)
spec:
  targets:
  - ./templates/dotnet/template.yaml
  - ./templates/generic-import-from-repo/template.yaml
  - ./templates/go/template.yaml
  - ./templates/java-quarkus/template.yaml
  - ./templates/java-springboot/template.yaml
  - ./templates/nodejs/template.yaml
  - ./templates/python/template.yaml
  - ./templates/openclaw-agent/template.yaml
  - ./templates/openclaw-agent-genesis/template.yaml
  - ./templates/karpathy-research-agent/template.yaml
  # Integration-test / demo suite Component (lives in the agent-office
  # gitops repo). Absolute target — this Location has no kind rules, so
  # the Component is accepted. Gives the suite its CI tab in Dev Hub.
  - https://github.com/enterprisewebservice/agent-office/blob/main/integration-tests/catalog-info.yaml
